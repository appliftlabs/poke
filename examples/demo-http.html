<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Poke — DB-backed demo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; }
      header { background: #0f172a; color: #fff; padding: 40px; text-align: center; }
      main { max-width: 800px; margin: 32px auto; padding: 0 24px; }
      .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; margin: 16px 0; }
      button.demo { padding: 10px 16px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font: inherit; }
    </style>
  </head>
  <body>
    <header><h1 data-testid="title">Multi-user Poke</h1></header>
    <main>
      <div class="card">
        <h2 data-testid="section">Comments live in Postgres, shared in realtime</h2>
        <p>
          Run <code>server/</code> (see its README), then open this page in two
          tabs: <a href="?name=Ada">?name=Ada</a> and
          <a href="?name=Grace">?name=Grace</a>. A pin one drops shows up for the
          other within a second — no reload.
        </p>
        <button class="demo" data-testid="cta">A button to pin</button>
      </div>
    </main>
    <script type="module">
      import { init, HttpAdapter } from "../dist/index.js";

      // Multi-user: comments live in Postgres via the reference server, and
      // realtime is automatic — HttpAdapter subscribes to the SSE stream, so a
      // pin another person drops shows up here within a second.
      // `?name=` just makes it easy to open two tabs as two people.
      const name = new URLSearchParams(location.search).get("name");

      init({
        ...(name ? { user: { name } } : {}), // else: prompt + remember
        pageId: "http-demo-page",
        adapter: new HttpAdapter({ baseUrl: "http://localhost:4000" }),
      });
    </script>
  </body>
</html>
